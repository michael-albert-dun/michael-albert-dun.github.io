<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Michael's puzzles</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="page">
    <header class="masthead">
      <h1>Michael's puzzles</h1>
    </header>

    <section class="puzzle-list" aria-label="Puzzle links">
      <a class="puzzle-card tilexicon-card" href="/tilexicon/">
        <span class="puzzle-art word-art" aria-hidden="true">
          <span>T</span>
          <span>I</span>
          <span>L</span>
          <span>E</span>
          <span>X</span>
          <span>I</span>
          <span>C</span>
          <span>O</span>
          <span>N</span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-name">Tilexicon</span>
          <span class="device-icons" aria-label="Works on mobile and desktop">
            <span class="device-icon phone" aria-hidden="true"></span>
            <span class="device-icon screen" aria-hidden="true"></span>
          </span>
        </span>
      </a>

      <a class="puzzle-card digitiler-card" href="/digitiler/">
        <span class="puzzle-art digit-art" aria-hidden="true">
          <span>1</span>
          <span>3</span>
          <span>6</span>
          <span>2</span>
          <span>5</span>
          <span>4</span>
          <span>8</span>
          <span>7</span>
          <span>2</span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-name">Digitiler</span>
          <span class="device-icons" aria-label="Works on mobile and desktop">
            <span class="device-icon phone" aria-hidden="true"></span>
            <span class="device-icon screen" aria-hidden="true"></span>
          </span>
        </span>
      </a>
    </section>
  </main>
</body>

</html>
