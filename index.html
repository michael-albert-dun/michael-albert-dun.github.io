<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Michael's puzzles</title>
  <link rel="stylesheet" href="styles.css?v=20260715c">
</head>

<body>
  <main class="page">
    <header class="masthead">
      <h1>Michael's puzzles</h1>
    </header>

    <section class="puzzle-list" aria-label="Puzzle links">
      <a class="puzzle-card tilexicon-card" href="/tilexicon/">
        <span class="puzzle-art word-art" aria-hidden="true">
          <span>T</span>
          <span>I</span>
          <span>L</span>
          <span>E</span>
          <span>X</span>
          <span>I</span>
          <span>C</span>
          <span>O</span>
          <span>N</span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">Tilexicon</span></span>
          <span class="puzzle-title-meta">
            <span class="device-icons" aria-label="Works on mobile and desktop">
              <span class="device-icon phone" aria-hidden="true"></span>
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>

      <a class="puzzle-card tilehexicon-card" href="/tilehexicon/">
        <span class="puzzle-art hex-art" aria-hidden="true">
          <span class="hex-tile hex-word-a" data-letter="T"></span>
          <span class="hex-tile hex-word-b" data-letter="I"></span>
          <span class="hex-tile hex-word-c" data-letter="L"></span>
          <span class="hex-tile hex-word-d" data-letter="E"></span>
          <span class="hex-tile hex-word-b" data-letter="H"></span>
          <span class="hex-tile hex-word-a" data-letter="E"></span>
          <span class="hex-tile hex-word-d" data-letter="X"></span>
          <span class="hex-tile hex-word-c" data-letter="I"></span>
          <span class="hex-tile hex-word-b" data-letter="C"></span>
          <span class="hex-tile hex-word-a" data-letter="O"></span>
          <span class="hex-tile hex-word-d" data-letter="N"></span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">TileHexicon</span></span>
          <span class="puzzle-title-meta">
            <span class="device-icons" aria-label="Works on mobile and desktop">
              <span class="device-icon phone" aria-hidden="true"></span>
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>

      <a class="puzzle-card digitiler-card" href="/digitiler/">
        <span class="puzzle-art digit-art" aria-hidden="true">
          <span>1</span>
          <span>3</span>
          <span>6</span>
          <span>2</span>
          <span>5</span>
          <span>4</span>
          <span>8</span>
          <span>7</span>
          <span>2</span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">Digitiler</span></span>
          <span class="puzzle-title-meta">
            <span class="device-icons" aria-label="Works on mobile and desktop">
              <span class="device-icon phone" aria-hidden="true"></span>
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>

      <a class="puzzle-card hexiler-card" href="/hexiler/">
        <span class="puzzle-art hexiler-art" aria-hidden="true">
          <span class="hexiler-tile hexiler-a" data-digit="1"></span>
          <span class="hexiler-tile hexiler-b" data-digit="3"></span>
          <span class="hexiler-tile hexiler-c" data-digit="6"></span>
          <span class="hexiler-tile hexiler-d" data-digit="2"></span>
          <span class="hexiler-tile hexiler-e" data-digit="5"></span>
          <span class="hexiler-tile hexiler-f" data-digit="4"></span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">Hexiler</span><span class="prototype-badge">Prototype</span></span>
          <span class="puzzle-title-meta">
            <span class="device-icons" aria-label="Works on mobile and desktop">
              <span class="device-icon phone" aria-hidden="true"></span>
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>

      <a class="puzzle-card deliagonal-card" href="/deliagonal/">
        <span class="puzzle-art deliagonal-art" aria-hidden="true">
          <span class="food-icon food-burger"></span>
          <span class="food-icon food-egg"></span>
          <span class="food-icon food-milkshake"></span>
          <span class="food-icon food-waffle"></span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">Deliagonal</span></span>
          <span class="puzzle-title-meta">
            <span class="device-icons" aria-label="Works on mobile and desktop">
              <span class="device-icon phone" aria-hidden="true"></span>
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>

      <a class="puzzle-card matrixmind-card" href="/matrixmind/">
        <span class="puzzle-art matrix-art" aria-hidden="true">
          <span class="matrix-score-cell"></span>
          <span class="matrix-score-cell is-column"></span>
          <span class="matrix-score-cell is-column"><b class="matrix-pip is-near"></b></span>
          <span class="matrix-score-cell is-column"><b class="matrix-pip is-near"></b><b class="matrix-pip is-near"></b></span>
          <span class="matrix-score-cell"></span>
          <span class="matrix-score-cell is-left"><b class="matrix-pip is-exact"></b></span>
          <span class="matrix-stone stone-orange"></span>
          <span class="matrix-stone stone-green"></span>
          <span class="matrix-stone stone-sky"></span>
          <span class="matrix-score-cell is-right"><b class="matrix-pip is-near"></b></span>
          <span class="matrix-score-cell is-left"><b class="matrix-pip is-exact"></b></span>
          <span class="matrix-stone stone-purple"></span>
          <span class="matrix-stone stone-orange"></span>
          <span class="matrix-stone stone-green"></span>
          <span class="matrix-score-cell is-right"><b class="matrix-pip is-near"></b><b class="matrix-pip is-near"></b></span>
          <span class="matrix-score-cell"></span>
          <span class="matrix-score-cell is-column"><b class="matrix-pip is-exact"></b></span>
          <span class="matrix-score-cell is-column"><b class="matrix-pip is-exact"></b></span>
          <span class="matrix-score-cell is-column"></span>
          <span class="matrix-score-cell"></span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">Matrixmind</span></span>
          <span class="puzzle-title-meta">
            <span class="device-icons" aria-label="Works on desktop">
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>

      <a class="puzzle-card tintangle-card" href="/tintangle/">
        <span class="puzzle-art tintangle-art" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">Tintangle</span><span class="prototype-badge">Prototype</span></span>
          <span class="puzzle-title-meta">
            <span class="device-icons" aria-label="Works on mobile and desktop">
              <span class="device-icon phone" aria-hidden="true"></span>
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>

      <a class="puzzle-card wordtangle-card" href="/tintangle/wordtangle/">
        <span class="puzzle-art wordtangle-art" aria-hidden="true">
          <span>M</span><span>A</span><span>G</span><span>R</span>
          <span>K</span><span>E</span><span>T</span><span>I</span>
          <span>L</span><span>I</span><span>H</span><span>D</span>
          <span>K</span><span>E</span><span>I</span><span>S</span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">Wordtangle</span><span class="prototype-badge">Prototype</span></span>
          <span class="puzzle-title-meta">
            <span class="danger-badge">⚠ Very hard</span>
            <span class="device-icons" aria-label="Works on mobile and desktop">
              <span class="device-icon phone" aria-hidden="true"></span>
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>

      <a class="puzzle-card reflexicon-card" href="/tintangle/reflexicon/">
        <span class="puzzle-art reflexicon-art" aria-hidden="true">
          <span>T</span><span>U</span><span>R</span><span>T</span>
          <span>N</span><span>I</span><span>L</span><span>E</span>
          <span>I</span><span>N</span><span>T</span><span>W</span>
          <span>O</span><span>O</span><span>R</span><span>D</span>
        </span>
        <span class="puzzle-title-line">
          <span class="puzzle-title-primary"><span class="puzzle-name">Reflexicon</span><span class="prototype-badge">Prototype</span></span>
          <span class="puzzle-title-meta">
            <span class="device-icons" aria-label="Works on mobile and desktop">
              <span class="device-icon phone" aria-hidden="true"></span>
              <span class="device-icon screen" aria-hidden="true"></span>
            </span>
          </span>
        </span>
      </a>
    </section>
  </main>
</body>

</html>
